services:
  - type: web
    name: tradesflow-web
    runtime: node
    plan: free
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: sh scripts/start.sh
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: RUN_DB_SEED
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: tradesflow-db
          property: connectionString

databases:
  - name: tradesflow-db
    databaseName: tradesflow
    user: tradesflow
    plan: free
